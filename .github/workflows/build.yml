name: Build Desktop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 编译（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          add-job-summary: "on-failure"

      - name: 编译
        run: gradle :packageDistributionForCurrentOS --stacktrace
        continue-on-error: true

      - name: 回退：只编译 jar
        if: failure()
        run: gradle build --stacktrace

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: air2-desktop-${{ matrix.os }}
          path: build/compose/binaries/main/
          retention-days: 30
